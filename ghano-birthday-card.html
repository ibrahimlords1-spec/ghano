<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Ghano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft-1:#cdb28c;
    --kraft-2:#b99a71;
    --ink:#2b2620;
    --maroon:#7a2222;
    --navy:#2c3a63;
    --cream:#f2e9d8;
    --pink:#d98f92;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    min-height:100%;
    font-family:'EB Garamond', serif;
    background-color:var(--kraft-2);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.10), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(0,0,0,0.10), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, var(--kraft-1), var(--kraft-2));
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:calc(48px + env(safe-area-inset-top,0px));
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
    padding-left:16px;
    padding-right:16px;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    perspective:2200px;
  }

  .hint{
    font-family:'Caveat', cursive;
    font-size:22px;
    color:var(--ink);
    opacity:.75;
    margin:14px 0 0;
    text-align:center;
    min-height:28px;
  }

  .card-wrap{
    position:relative;
    width:min(78vw, 320px);
    aspect-ratio:1240/1748;
  }

  .cover-btn{
    position:absolute;
    inset:0;
    border:none;
    padding:0;
    background:none;
    cursor:pointer;
    border-radius:6px;
    box-shadow:0 18px 40px rgba(20,14,6,0.35), 0 2px 6px rgba(20,14,6,0.25);
    transition:transform .5s cubic-bezier(.6,.1,.3,1), opacity .45s ease, box-shadow .5s ease;
    transform-style:preserve-3d;
    -webkit-tap-highlight-color:transparent;
  }
  .cover-btn img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:6px;
  }
  .cover-btn:active{ transform:scale(0.97); }

  .card-wrap.is-open .cover-btn{
    opacity:0;
    transform:scale(.85) rotateY(-35deg);
    box-shadow:none;
    pointer-events:none;
  }

  .glow-pulse{
    position:absolute;
    inset:-6px;
    border-radius:10px;
    box-shadow:0 0 0 0 rgba(255,244,214,0.0);
    animation:pulse 2.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,244,214,0.0); }
    50%{ box-shadow:0 0 22px 4px rgba(255,244,214,0.35); }
  }

  .spread{
    position:absolute;
    inset:0;
    display:flex;
    gap:3.5%;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease .05s;
  }
  .card-wrap.is-open .spread{
    opacity:1;
    pointer-events:auto;
  }

  .page{
    position:relative;
    flex:1 1 0;
    height:100%;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 14px 34px rgba(20,14,6,0.32);
    background:#e9ddc4;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.6,.1,.25,1);
    backface-visibility:hidden;
  }
  .left-page{ transform-origin:right center; transform:rotateY(-92deg); }
  .right-page{ transform-origin:left center; transform:rotateY(92deg); }
  .card-wrap.is-open .left-page{ transform:rotateY(0deg); transition-delay:.12s; }
  .card-wrap.is-open .right-page{ transform:rotateY(0deg); transition-delay:.12s; }

  .page-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }

  .hinge-shadow{
    position:absolute;
    top:0; bottom:0;
    width:14px;
    pointer-events:none;
    opacity:.5;
  }
  .left-page .hinge-shadow{ right:0; background:linear-gradient(to left, rgba(0,0,0,.35), transparent); }
  .right-page .hinge-shadow{ left:0; background:linear-gradient(to right, rgba(0,0,0,.35), transparent); }

  .letter-zone{
    position:absolute;
    left:6%;
    top:26%;
    width:58%;
    height:56%;
    cursor:pointer;
    z-index:3;
    border:none;
    background:none;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .letter-card{
    position:absolute;
    left:6%;
    top:26%;
    width:58%;
    min-height:30%;
    background:
      repeating-linear-gradient(transparent 0 27px, rgba(44,58,99,0.08) 27px 28px),
      #f6efdd;
    border-radius:3px;
    box-shadow:0 6px 16px rgba(20,14,6,0.28);
    padding:8% 7%;
    transform-origin:20% 30%;
    transform:scale(.55) translate(-4%, 6%) rotate(-3deg);
    transition:transform .5s cubic-bezier(.4,.2,.2,1), box-shadow .5s ease;
    z-index:3;
    cursor:pointer;
  }
  .letter-card::before{
    content:"";
    position:absolute; inset:0;
    border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(44,58,99,0.08);
    pointer-events:none;
  }
  .letter-card p{
    margin:0 0 .6em;
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-weight:500;
    color:var(--navy);
    font-size:clamp(10px, 2.6vw, 15px);
    line-height:1.55;
  }
  .letter-card .sign-off{
    margin-top:.8em;
    font-style:normal;
    font-family:'Caveat', cursive;
    font-size:clamp(16px, 4vw, 22px);
    color:var(--maroon);
  }
  .letter-card.is-open{
    transform:scale(1.32) translate(10%, 2%) rotate(0deg);
    box-shadow:0 22px 50px rgba(20,14,6,0.4);
    z-index:5;
  }

  .cake-zone{ position:absolute; inset:0; }
  .flame{
    position:absolute;
    transform-origin:50% 92%;
    pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
    transition:opacity .35s ease, transform .12s ease-out;
  }
  .flame img{ width:100%; height:100%; display:block; }
  .flame.out{ opacity:0; transform:scale(.4) rotate(50deg); }

  .flame-left{ left:28.2%; top:36.6%; width:11.6%; }
  .flame-middle{ left:45.9%; top:25.6%; width:11.9%; }
  .flame-right{ left:61.1%; top:35.3%; width:10.4%; }

  .blow-panel{
    position:absolute;
    left:6%; right:6%; bottom:4%;
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .meter{
    width:100%;
    height:9px;
    border-radius:5px;
    background:rgba(43,38,32,0.18);
    overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .meter-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#8fae7c,#e0b84f,var(--maroon));
    transition:width .08s linear;
  }
  .blow-status{
    font-family:'EB Garamond', serif;
    font-size:11.5px;
    color:var(--ink);
    text-align:center;
    opacity:.85;
    min-height:15px;
  }
  .blow-controls{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .pill-btn{
    font-family:'EB Garamond', serif;
    font-size:11.5px;
    padding:6px 11px;
    border-radius:999px;
    border:1px solid rgba(43,38,32,0.35);
    background:rgba(246,239,221,0.85);
    color:var(--ink);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .pill-btn:active{ transform:scale(.96); }
  .pill-btn.active{ background:var(--maroon); color:#f6efdd; border-color:var(--maroon); }

  .wish-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(242,233,216,0.0);
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease, background .5s ease;
    z-index:6;
    flex-direction:column;
    padding:10%;
  }
  .wish-overlay.show{ opacity:1; pointer-events:auto; background:rgba(242,233,216,0.55); }
  .wish-text{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(20px, 6vw, 34px);
    color:var(--maroon);
    text-shadow:0 2px 8px rgba(246,239,221,0.9);
    margin:0 0 14px;
  }
  .relight-btn{
    font-family:'EB Garamond', serif;
    font-size:13px;
    padding:8px 18px;
    border-radius:999px;
    border:1px solid var(--maroon);
    background:#f6efdd;
    color:var(--maroon);
    cursor:pointer;
  }

  .confetti-piece{
    position:absolute;
    top:-10%;
    border-radius:2px;
    animation:confetti-fall linear forwards;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(130%) rotate(var(--rot)); opacity:.85; }
  }

  .back-btn{
    margin-top:28px;
    font-family:'EB Garamond', serif;
    font-size:14px;
    padding:9px 20px;
    border-radius:999px;
    border:1px solid rgba(43,38,32,0.4);
    background:rgba(246,239,221,0.85);
    color:var(--ink);
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .card-wrap.is-open ~ .back-btn{ opacity:1; pointer-events:auto; }

  @media (min-width:640px){ .card-wrap{ width:min(60vw, 380px); } }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>

          <div class="blow-panel">
            <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
            <div class="blow-status" id="blowStatus">tap "use mic" and blow, or hold the button</div>
            <div class="blow-controls">
              <button class="pill-btn" id="micBtn">🎙️ use mic</button>
              <button class="pill-btn" id="holdBtn">💨 hold to blow</button>
            </div>
          </div>

          <div class="wish-overlay" id="wishOverlay">
            <p class="wish-text" id="wishText">make a wish, Ghano</p>
            <button class="relight-btn" id="relightBtn">relight candles</button>
          </div>
        </div>
        <div class="hinge-shadow"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">tap the card to open it</div>
  <button class="back-btn" id="backBtn">‹ back to cover</button>
</div>

<script>
(function(){
  "use strict";

  var LETTER_TEXT = [
    "I love u so much Ghano, and I'm so happy to see you turn 18, my love.",
    "I wish you a very happy birthday and a very blessed life ahead \u2014 you mean the world to me."
  ];
  var WISH_NAME = "Ghano";

  var cardWrap = document.getElementById('cardWrap');
  var coverBtn = document.getElementById('coverBtn');
  var backBtn = document.getElementById('backBtn');
  var hint = document.getElementById('hint');
  var letterZone = document.getElementById('letterZone');
  var letterCard = document.getElementById('letterCard');
  var letterTextEl = document.getElementById('letterText');
  var wishText = document.getElementById('wishText');

  LETTER_TEXT.forEach(function(line, i){
    if(i>0){
      var p2 = document.createElement('p');
      p2.textContent = line;
      letterCard.insertBefore(p2, letterCard.querySelector('.sign-off'));
    } else {
      letterTextEl.textContent = line;
    }
  });
  wishText.textContent = "make a wish, " + WISH_NAME;

  var isOpen = false;
  var letterOpen = false;

  function openCard(){
    if(isOpen) return;
    isOpen = true;
    cardWrap.classList.add('is-open');
    hint.textContent = 'tap the letter to read it \u00b7 blow the candles to make a wish';
  }
  function closeCard(){
    isOpen = false;
    cardWrap.classList.remove('is-open');
    hint.textContent = 'tap the card to open it';
    if(letterOpen){ letterOpen = false; letterCard.classList.remove('is-open'); }
  }
  coverBtn.addEventListener('click', openCard);
  backBtn.addEventListener('click', closeCard);

  function toggleLetter(){
    letterOpen = !letterOpen;
    letterCard.classList.toggle('is-open', letterOpen);
  }
  letterZone.addEventListener('click', toggleLetter);
  letterCard.addEventListener('click', function(e){
    e.stopPropagation();
    toggleLetter();
  });

  var flames = {
    left: document.getElementById('flameLeft'),
    middle: document.getElementById('flameMiddle'),
    right: document.getElementById('flameRight')
  };
  var meterFill = document.getElementById('meterFill');
  var blowStatus = document.getElementById('blowStatus');
  var micBtn = document.getElementById('micBtn');
  var holdBtn = document.getElementById('holdBtn');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');

  var audioCtx = null, analyser = null, dataArray = null, micStream = null;
  var micActive = false;
  var holdActive = false;
  var candlesOut = false;
  var blowAccum = 0;
  var lastFrameTime = null;
  var rafId = null;
  var THRESHOLD = 0.16;
  var NEEDED_MS = 500;

  function setStatus(msg){ blowStatus.textContent = msg; }

  function startMic(){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      setStatus('mic not available here \u2014 use hold to blow below');
      return;
    }
    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      setStatus('mic needs https hosting \u2014 use hold to blow below');
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      micStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.35;
      dataArray = new Uint8Array(analyser.fftSize);
      source.connect(analyser);
      micActive = true;
      micBtn.classList.add('active');
      micBtn.textContent = '🎙️ mic on';
      setStatus('blow into the mic \u2014 keep it steady');
      ensureLoop();
    }).catch(function(err){
      setStatus('mic blocked \u2014 use hold to blow below');
    });
  }
  function stopMic(){
    if(micStream){ micStream.getTracks().forEach(function(t){ t.stop(); }); }
    if(audioCtx){ audioCtx.close(); }
    audioCtx = null; analyser = null; micStream = null;
    micActive = false;
    micBtn.classList.remove('active');
    micBtn.textContent = '🎙️ use mic';
  }
  micBtn.addEventListener('click', function(){
    if(micActive){ stopMic(); setStatus('mic off \u2014 tap "use mic" or hold the button'); }
    else { startMic(); }
  });

  function getMicLevel(){
    if(!analyser) return 0;
    analyser.getByteTimeDomainData(dataArray);
    var sum = 0;
    for(var i=0;i<dataArray.length;i++){
      var v = (dataArray[i]-128)/128;
      sum += v*v;
    }
    var rms = Math.sqrt(sum/dataArray.length);
    return Math.min(1, rms*3.2);
  }

  function setHold(active){
    holdActive = active;
    holdBtn.classList.toggle('active', active);
    if(active && !rafId){ ensureLoop(); }
  }
  holdBtn.addEventListener('mousedown', function(){ setHold(true); });
  holdBtn.addEventListener('touchstart', function(e){ e.preventDefault(); setHold(true); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
    holdBtn.addEventListener(ev, function(){ setHold(false); });
  });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && isOpen && !candlesOut){ e.preventDefault(); setHold(true); }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space'){ setHold(false); }
  });

  function ensureLoop(){
    if(rafId) return;
    lastFrameTime = null;
    rafId = requestAnimationFrame(loop);
  }

  function loop(ts){
    if(lastFrameTime===null) lastFrameTime = ts;
    var dt = ts - lastFrameTime;
    lastFrameTime = ts;

    var level = holdActive ? 0.9 : getMicLevel();
    meterFill.style.width = Math.round(level*100) + '%';

    if(!candlesOut){
      var jitter = (Math.random()-0.5) * 14 * level;
      var bend = level * 30;
      Object.keys(flames).forEach(function(key, idx){
        var dir = (idx===0? -1 : idx===2 ? 1 : (Math.random()>0.5?1:-1));
        flames[key].style.transform = 'rotate(' + (dir*bend + jitter) + 'deg) scale(' + (1 - level*0.12) + ')';
      });

      if(level > THRESHOLD){
        blowAccum += dt;
        setStatus('blowing... keep going');
      } else {
        blowAccum = Math.max(0, blowAccum - dt*1.5);
        if(micActive) setStatus('blow into the mic \u2014 keep it steady');
        else if(holdActive) setStatus('blowing...');
      }

      if(blowAccum >= NEEDED_MS){
        extinguishCandles();
      }
    }

    if(micActive || holdActive){
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
      blowAccum = 0;
      meterFill.style.width = '0%';
    }
  }

  function extinguishCandles(){
    candlesOut = true;
    var order = [flames.left, flames.middle, flames.right];
    order.forEach(function(el, i){
      setTimeout(function(){ el.classList.add('out'); }, i*140);
    });
    setStatus('all blown out!');
    setTimeout(function(){
      wishOverlay.classList.add('show');
      launchConfetti();
    }, order.length*140 + 250);
  }

  function relight(){
    candlesOut = false;
    blowAccum = 0;
    Object.keys(flames).forEach(function(key){
      flames[key].classList.remove('out');
      flames[key].style.transform = 'rotate(0deg) scale(1)';
    });
    wishOverlay.classList.remove('show');
    clearConfetti();
    setStatus(micActive ? 'blow into the mic \u2014 keep it steady' : 'tap "use mic" and blow, or hold the button');
  }
  relightBtn.addEventListener('click', relight);

  var confettiColors = ['#7a2222','#2c3a63','#d98f92','#8fae7c','#f2e9d8','#b99a71'];
  var confettiLayer = null;
  function launchConfetti(){
    confettiLayer = document.createElement('div');
    confettiLayer.style.position='absolute';
    confettiLayer.style.inset='0';
    confettiLayer.style.overflow='hidden';
    confettiLayer.style.pointerEvents='none';
    confettiLayer.style.zIndex='7';
    wishOverlay.parentElement.appendChild(confettiLayer);
    for(var i=0;i<46;i++){
      var p = document.createElement('div');
      p.className='confetti-piece';
      var size = 5 + Math.random()*7;
      p.style.width = size+'px';
      p.style.height = (size*0.5+3)+'px';
      p.style.left = (Math.random()*100)+'%';
      p.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      p.style.setProperty('--rot', (Math.random()*360-180)+'deg');
      p.style.animationDuration = (2.2 + Math.random()*1.6)+'s';
      p.style.animationDelay = (Math.random()*0.5)+'s';
      confettiLayer.appendChild(p);
    }
  }
  function clearConfetti(){
    if(confettiLayer && confettiLayer.parentElement){
      confettiLayer.parentElement.removeChild(confettiLayer);
    }
    confettiLayer = null;
  }

})();
</script>
</body>
</html>
